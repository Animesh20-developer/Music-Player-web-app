<!DOCTYPE html>
<html>
<head>
  <title>Music Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="login" class="page">
  <div class="box">
    <h2>🎵 Music Player Login</h2>
    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">
    <button id="loginBtn">Login</button>
    <p id="error"></p>
  </div>
</div>

<div id="music" class="page hidden">
  <div class="app">
    <h1>🎵 Music Player</h1>

    <input id="search" placeholder="Search songs...">

    <div class="player">
      <img id="cover" src="">
      <h2 id="title"></h2>
      <p id="artist"></p>

      <audio id="audio"></audio>

      <input id="progress" type="range" value="0">

      <div>
        <button id="prev">⏮</button>
        <button id="play">▶</button>
        <button id="next">⏭</button>
      </div>

      <p>🔊 <input id="volume" type="range" min="0" max="1" step="0.01" value="1"></p>
    </div>

    <div class="playlist">
      <h2>My Playlist</h2>
      <div id="songs"></div>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
